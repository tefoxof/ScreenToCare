services:
  - type: web
    name: screen-to-care-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import postgres_store; postgres_store.initialize_schema()" && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /openapi.json
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: screen-to-care-db
          property: connectionString
      - key: CAREBRIDGE_SESSION_SECRET
        generateValue: true
      - key: CAREBRIDGE_COOKIE_SECURE
        value: "true"
      - key: CAREBRIDGE_CORS_ORIGINS
        value: https://screen-to-care-ui.onrender.com

  - type: web
    name: screen-to-care-ui
    runtime: static
    buildCommand: cd carebridge-ui && npm ci && npm run build
    staticPublishPath: ./carebridge-ui/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: screen-to-care-api
          property: host

databases:
  - name: screen-to-care-db
    databaseName: screentocare
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
